<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Management | StudentConnect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/main.css">
</head>
<body class="portal">
<aside id="sidebar"></aside>
<div class="portal-body">
  <div id="topbar" class="portal-topbar"></div>
  <main id="main" class="portal-main">
    <header id="head"></header>
    <div id="message"></div>
    <div class="row-wrap" style="margin-top:1.25rem;align-items:flex-end">
      <label class="field" style="margin:0;min-width:16rem"><span>Search</span><input id="search" type="search" placeholder="Name, student number or email"></label>
      <div id="tabs" class="tabs" style="margin:0"></div>
    </div>
    <div id="list" class="stack" style="margin-top:1.25rem"></div>
  </main>
</div>
<script type="module" src="/js/admin-students.js"></script>
</body>
</html>

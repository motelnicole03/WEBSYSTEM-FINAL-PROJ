<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My profile | StudentConnect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/main.css">
<link rel="stylesheet" href="/css/employer-profile.css">
</head>
<body class="portal">
<aside id="sidebar"></aside>
<div class="portal-body">
  <div id="topbar" class="portal-topbar"></div>
  <main id="main" class="portal-main">
    <header id="head"></header>
    <div id="message"></div>
    <div id="completeness"></div>
    <section id="company-card" class="card co-head"></section>
    <div class="co-grid">
      <div class="co-col">
        <section class="card"><h3>About the company</h3><div id="about"></div></section>
        <section class="card"><h3>Open positions</h3><div id="positions"></div></section>
      </div>
      <div class="co-col">
        <section class="card"><h3>Company details</h3><div id="details"></div></section>
        <section class="card"><h3>Contact</h3><div id="contact"></div></section>
      </div>
    </div>
  </main>
</div>
<script type="module" src="/js/employer-profile.js"></script>
</body>
</html>

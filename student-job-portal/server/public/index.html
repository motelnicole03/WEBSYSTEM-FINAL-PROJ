<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find internships and jobs | StudentConnect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/main.css">
</head>
<body>
<header id="site-header" class="site-header"></header>
<section class="hero">
  <img src="/img/hero.jpg" alt="" onerror="this.remove()">
  <div class="hero-content">
    <h1>Start your career, one internship at a time</h1>
    <p class="sub">Browse opportunities from verified employers and apply in minutes.</p>
    <div id="hero-search" style="width:100%;max-width:48rem;margin-top:2rem"></div>
  </div>
</section>
<main class="container">
  <div id="message"></div>
  <h2 class="bold mt-lg">Featured opportunities</h2>
  <div id="featured" class="cards mt-sm"></div>
  <h2 class="bold mt-lg">Hiring companies</h2>
  <div id="companies" class="row-wrap mt-sm"></div>
</main>
<footer id="site-footer"></footer>
<script type="module" src="/js/landing.js"></script>
</body>
</html>

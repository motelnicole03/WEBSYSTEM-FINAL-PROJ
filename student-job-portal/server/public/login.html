<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login | StudentConnect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/main.css">
</head>
<body>
<header id="site-header" class="site-header"></header>
<main class="auth">
  <form id="login-form" class="panel">
    <h1 class="bold">Welcome back</h1>
    <div id="message"></div>
    <label class="field"><span>Email</span><input name="email" type="email" required autocomplete="email"></label>
    <label class="field"><span>Password</span><input name="password" type="password" required autocomplete="current-password"></label>
    <button class="btn primary" style="width:100%">Login</button>
    <p class="muted small mt">No account yet? <a class="link" href="/register.html">Sign up</a></p>
  </form>
</main>
<footer id="site-footer"></footer>
<script type="module" src="/js/login.js"></script>
</body>
</html>
